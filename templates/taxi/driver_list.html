{% extends "base.html" %}

{% block content %}
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
    </tr>
    </thead>
    <tbody>
    {% if driver_list %}
      {% for driver in driver_list %}
        <tr>
          <th><a href="{{ driver.get_absolute_url }}">{{ driver.id }}</a></th>
          <td>{{ driver.first_name }} {{ driver.last_name }}</td>
        </tr>
      {% endfor %}
    {% endif %}
    </tbody>
  </table>
{% endblock %}
